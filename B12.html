<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo form và các điều khiển</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .form-container {
            width: 450px;
            margin: 20px auto;
            border: 1px solid #7f9db9;
            background-color: #d8e8d8;
            padding: 10px;
        }
        .form-header {
            text-align: center;
            color: #006600;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #d8e8d8;
        }
        td {
            padding: 4px;
            font-size: 14px;
            vertical-align: middle;
        }

        input[type="text"] {
            width: 90%;
            padding: 2px;
            border: 1px solid #7f9db9;
        }

        select {
            border: 1px solid #7f9db9;
        }

        .btn-container {
            text-align: center;
            padding-top: 5px;
        }

        input[type="button"] {
            padding: 2px 12px;
            cursor: pointer;
        }

        .message-label {
            text-align: center;
            color: #ff0000;
            font-weight: bold;
            font-size: 14px;
            min-height: 20px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="form-header">Phiếu đăng ký tham gia chương trình khuyến mãi</div>

        <form id="formKhuyenMai">
            <table border="1" style="border-color: #a0a0a0; border-collapse: collapse;">
                <tr>
                    <td>Họ và tên</td>
                    <td>
                        <input type="text" id="txtHoTen" size="30" value="Nguyễn Ngọc Quỳnh Nga">
                    </td>
                </tr>

                <tr>
                    <td>Địa chỉ</td>
                    <td>
                        <input type="text" id="txtDiaChi" size="30" value="2Bia Hùng Vương, Q10">
                    </td>
                </tr>

                <tr>
                    <td>Điện thoại</td>
                    <td>
                        <input type="text" id="txtDienThoai" size="20" value="0909097506">
                    </td>
                </tr>

                <tr>
                    <td>Phái</td>
                    <td>
                        <input type="radio" id="radNam" name="radPhai" value="Nam"> Nam
                        <input type="radio" id="radNu" name="radPhai" value="Nữ" checked> Nữ
                    </td>
                </tr>

                <tr>
                    <td>Nghề nghiệp</td>
                    <td>
                        <select id="cboNgheNghiep">
                            <option value="Bác sĩ">Bác sĩ</option>
                            <option value="Kỹ sư">Kỹ sư</option>
                            <option value="Giáo viên" selected>Giáo viên</option>
                            <option value="Khác">Khác</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>Chọn sản phẩm tham gia</td>
                    <td>
                        <select id="lstSanPham" size="4" multiple style="width: 100%;">
                            <option value="Kem đánh răng" selected>Kem đánh răng</option>
                            <option value="Bột giặt">Bột giặt</option>
                            <option value="Dầu gội đầu" selected>Dầu gội đầu</option>
                            <option value="Sữa tắm">Sữa tắm</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>Số người dự đoán tham gia</td>
                    <td>
                        <input type="text" id="txtSoDuDoan" size="15" value="250000">
                    </td>
                </tr>

                <tr>
                    <td colspan="2" class="btn-container">
                        <input type="button" id="btnDongY" value="Đồng ý" onclick="xuLyDangKy()">
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        <div id="lblThongBao" class="message-label"></div>
                    </td>
                </tr>
            </table>
        </form>
    </div>

    <script>
        function xuLyDangKy() {
            document.getElementById("lblThongBao").innerText = "Bạn đã đăng ký thành công!!!";
        }
    </script>

</body>
</html>
